<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .flow-text { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    </style>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow0" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1400" height="850" fill="url(#bg0)"/>
  <circle cx="1180" cy="120" r="120" fill="#bae6fd" opacity="0.35"/>
  <circle cx="180" cy="740" r="130" fill="#ccfbf1" opacity="0.40"/>

  <text x="700" y="68" text-anchor="middle" class="title">Data Flow Diagram - Level 0</text>
  <text x="700" y="100" text-anchor="middle" class="subtitle">Context diagram for the Resume-Helper ATS analysis system</text>

  <g filter="url(#shadow0)">
    <rect x="110" y="280" width="280" height="200" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="250" y="350" text-anchor="middle" class="box-title">External Entity</text>
    <text x="250" y="392" text-anchor="middle" class="box-title">USER</text>
    <text x="250" y="434" text-anchor="middle" class="box-text">Student / job seeker</text>
  </g>

  <g filter="url(#shadow0)">
    <rect x="470" y="220" width="460" height="320" rx="36" fill="#ffffff" stroke="#5eead4" stroke-width="3"/>
    <circle cx="700" cy="350" r="108" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
    <text x="700" y="328" text-anchor="middle" class="box-title">1.0</text>
    <text x="700" y="364" text-anchor="middle" class="box-title">Resume-Helper</text>
    <text x="700" y="398" text-anchor="middle" class="box-text">ATS Analysis System</text>
  </g>

  <g filter="url(#shadow0)">
    <rect x="1010" y="280" width="280" height="200" rx="28" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1150" y="350" text-anchor="middle" class="box-title">System Output</text>
    <text x="1150" y="392" text-anchor="middle" class="box-title">ANALYSIS RESULT</text>
    <text x="1150" y="434" text-anchor="middle" class="box-text">Score, skills gap, suggestions</text>
  </g>

  <line x1="390" y1="380" x2="470" y2="380" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow0)"/>
  <text x="430" y="350" text-anchor="middle" class="flow-text">Resume file</text>
  <text x="430" y="374" text-anchor="middle" class="flow-text">+ Job description</text>

  <line x1="930" y1="380" x2="1010" y2="380" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow0)"/>
  <text x="970" y="350" text-anchor="middle" class="flow-text">ATS score</text>
  <text x="970" y="374" text-anchor="middle" class="flow-text">+ analysis details</text>

  <rect x="330" y="650" width="740" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="690" text-anchor="middle" class="flow-text">Level 0 Meaning</text>
  <text x="700" y="720" text-anchor="middle" class="box-text">At this level, the entire application is represented as one process that accepts user input and returns resume analysis output.</text>
</svg>
