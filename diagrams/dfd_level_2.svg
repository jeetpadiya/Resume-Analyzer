<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .proc { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .flow { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .store { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
    </style>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg2)"/>
  <text x="800" y="70" text-anchor="middle" class="title">Data Flow Diagram - Level 2</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">Detailed flow of upload, parsing, ATS scoring, and history management</text>

  <g filter="url(#shadow2)">
    <rect x="60" y="430" width="220" height="150" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="170" y="492" text-anchor="middle" class="proc">USER</text>
    <text x="170" y="528" text-anchor="middle" class="small">Authenticated user actions</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="350" y="120" width="280" height="120" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="490" y="172" text-anchor="middle" class="proc">2.1 Validate Token</text>
    <text x="490" y="204" text-anchor="middle" class="small">Authorize protected requests</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="350" y="290" width="280" height="120" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="490" y="342" text-anchor="middle" class="proc">2.2 Accept File Upload</text>
    <text x="490" y="374" text-anchor="middle" class="small">PDF / DOCX via Multer</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="350" y="460" width="280" height="120" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="490" y="512" text-anchor="middle" class="proc">2.3 Parse Resume Text</text>
    <text x="490" y="544" text-anchor="middle" class="small">pdf-parse / mammoth</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="350" y="630" width="280" height="120" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="490" y="682" text-anchor="middle" class="proc">2.4 Extract Resume Data</text>
    <text x="490" y="714" text-anchor="middle" class="small">skills, education, experience</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="350" y="800" width="280" height="120" rx="22" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="490" y="852" text-anchor="middle" class="proc">2.5 Save Resume</text>
    <text x="490" y="884" text-anchor="middle" class="small">status = parsed</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="760" y="260" width="300" height="120" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="910" y="312" text-anchor="middle" class="proc">3.1 Receive Job Description</text>
    <text x="910" y="344" text-anchor="middle" class="small">Resume id + job description</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="760" y="430" width="300" height="120" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="910" y="482" text-anchor="middle" class="proc">3.2 Build Safe Resume Object</text>
    <text x="910" y="514" text-anchor="middle" class="small">Normalize parsed data for scoring</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="760" y="600" width="300" height="120" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="910" y="652" text-anchor="middle" class="proc">3.3 Calculate ATS Score</text>
    <text x="910" y="684" text-anchor="middle" class="small">keywords, skills, format, sections</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="760" y="770" width="300" height="120" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="910" y="822" text-anchor="middle" class="proc">3.4 Save Analysis Result</text>
    <text x="910" y="854" text-anchor="middle" class="small">score, lable, missing skills, suggestions</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1180" y="180" width="260" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <line x1="1202" y1="208" x2="1418" y2="208" stroke="#f59e0b" stroke-width="3"/>
    <line x1="1202" y1="264" x2="1418" y2="264" stroke="#f59e0b" stroke-width="3"/>
    <text x="1310" y="242" text-anchor="middle" class="store">D1 USER DB</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1180" y="390" width="260" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <line x1="1202" y1="418" x2="1418" y2="418" stroke="#f59e0b" stroke-width="3"/>
    <line x1="1202" y1="474" x2="1418" y2="474" stroke="#f59e0b" stroke-width="3"/>
    <text x="1310" y="452" text-anchor="middle" class="store">D2 RESUME DB</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1180" y="640" width="260" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <line x1="1202" y1="668" x2="1418" y2="668" stroke="#f59e0b" stroke-width="3"/>
    <line x1="1202" y1="724" x2="1418" y2="724" stroke="#f59e0b" stroke-width="3"/>
    <text x="1310" y="702" text-anchor="middle" class="store">D3 ANALYSIS DB</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1170" y="840" width="280" height="160" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="1310" y="902" text-anchor="middle" class="proc">OUTPUT TO USER</text>
    <text x="1310" y="940" text-anchor="middle" class="small">ATS score, label,</text>
    <text x="1310" y="968" text-anchor="middle" class="small">breakdown, missing skills, suggestions</text>
  </g>

  <line x1="280" y1="468" x2="350" y2="180" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="245" y="316" class="flow">token / session</text>

  <line x1="280" y1="498" x2="350" y2="350" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="260" y="420" class="flow">resume file</text>

  <line x1="280" y1="532" x2="350" y2="520" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="245" y="560" class="flow">uploaded content</text>

  <line x1="280" y1="566" x2="350" y2="860" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="232" y="736" class="flow">analyze request</text>

  <line x1="490" y1="240" x2="490" y2="290" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="490" y1="410" x2="490" y2="460" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="490" y1="580" x2="490" y2="630" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="490" y1="750" x2="490" y2="800" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>

  <line x1="630" y1="860" x2="760" y2="320" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="680" y="566" class="flow">resumeId + JD</text>

  <line x1="630" y1="860" x2="760" y2="490" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="688" y="700" class="flow">saved resume</text>

  <line x1="910" y1="380" x2="910" y2="430" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="910" y1="550" x2="910" y2="600" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="910" y1="720" x2="910" y2="770" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>

  <line x1="630" y1="180" x2="1180" y2="235" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="848" y="180" class="flow">user lookup</text>

  <line x1="630" y1="860" x2="1180" y2="445" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="852" y="612" class="flow">resume document</text>

  <line x1="1060" y1="830" x2="1180" y2="695" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="1102" y="748" class="flow">analysis document</text>

  <line x1="1060" y1="830" x2="1170" y2="920" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow2)"/>
  <text x="1102" y="900" class="flow">final result</text>

  <rect x="300" y="960" width="980" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="790" y="1006" text-anchor="middle" class="small">This level shows how Resume-Helper validates access, parses the resume, extracts structured information, computes ATS scoring, and stores both resume and analysis records.</text>
</svg>
